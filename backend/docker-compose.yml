version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: womensafety-db
    environment:
      POSTGRES_DB: womensafety
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - womensafety-network

  backend:
    build: .
    container_name: womensafety-backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/womensafety
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    networks:
      - womensafety-network

volumes:
  postgres_data:

networks:
  womensafety-network:
    driver: bridge
